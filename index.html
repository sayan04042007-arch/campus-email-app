<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Formal Email Generator</title>
    <!-- Tailwind CSS for sleek styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex flex-col items-center justify-center selection:bg-cyan-500 selection:text-slate-950">

    <div class="max-w-lg w-full space-y-4">
        
        <header class="text-center space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-cyan-400">✉️ Campus Email Generator</h1>
            <p class="text-xs sm:text-sm text-slate-400">Turn raw complaints into polished, respectful emails in 2 seconds.</p>
        </header>

        <!-- Main Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-2xl backdrop-blur">

            <!-- 1. Recipient Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Sending To:</label>
                <select id="recipientSelect" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                    <option value="Hostel Warden">Hostel Warden</option>
                    <option value="Department Professor">Department Professor</option>
                    <option value="College Dean">College Dean</option>
                    <option value="Exam Cell Administrator">Exam Cell Administrator</option>
                    <option value="Library In-Charge">Library In-Charge</option>
                </select>
            </div>

            <!-- 2. Complaint Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">What's the issue? (Casual words):</label>
                <textarea id="issueInput" rows="3" placeholder="e.g. AC in room 204 is not cooling and exam starts in 2 days..."
                    class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition"></textarea>
            </div>

            <!-- 3. Submit Button -->
            <button id="generateBtn" onclick="generateEmail()" 
                class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-cyan-500/20 active:scale-[0.99] transition">
                Draft Formal Email
            </button>

            <!-- 4. Output Card -->
            <div id="outputContainer" class="hidden space-y-2 pt-3 border-t border-slate-800">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-cyan-400">Drafted Email:</span>
                    <button onclick="copyToClipboard()" id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span id="copyBtnText">Copy</span>
                    </button>
                </div>
                <div id="emailOutput" class="p-4 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm leading-relaxed whitespace-pre-wrap text-slate-300 font-mono"></div>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();

        // 🔑 PASTE YOUR SCRAMBLED BASE64 STRING INSIDE THESE QUOTES:
        const SCRAMBLED_KEY = "QVEuQWI4Uk42SW1XRE9nZ3FlQVptMk1SZWJXQ2NsVk10ZVMxWF9OUnF2VC1kTk95S1U5TFE=";

        function getDecodedKey() {
            try {
                return atob(SCRAMBLED_KEY);
            } catch (e) {
                return "";
            }
        }

        async function generateEmail() {
            const recipient = document.getElementById('recipientSelect').value;
            const issue = document.getElementById('issueInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const outputContainer = document.getElementById('outputContainer');
            const emailOutput = document.getElementById('emailOutput');

            if (!issue) {
                alert("Please describe your issue first!");
                return;
            }

            const apiKey = getDecodedKey();
            if (!apiKey || apiKey === "PASTE_YOUR_SCRAMBLED_KEY_HERE") {
                alert("Please paste your scrambled key into line 61 of index.html!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Drafting email...";
            outputContainer.classList.remove('hidden');
            emailOutput.innerText = "Drafting a professional email to " + recipient + "...";

            const prompt = `
                You are a formal communications expert for college students.
                Draft a formal, polite, and persuasive email to the "${recipient}".
                The student's issue is: "${issue}".

                Include:
                - A clear, professional Subject line
                - Respectful salutation
                - 2 concise body paragraphs explaining the situation and politely requesting swift action
                - Professional sign-off placeholders: [Student Name], [Roll Number], [Room / Dept]
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                               maxOutputTokens: 400
}
                    })
                });

                const data = await response.json();

                if (data.error) {
                    emailOutput.innerText = "❌ Server Busy: " + data.error.message + "\n\nPlease click the button once more!";
                    return;
                }

                const parts = data.candidates?.[0]?.content?.parts || [];
                const draftedEmail = parts.filter(p => p.text && !p.thought).map(p => p.text).join("\n") || parts.map(p => p.text).join("\n");

                emailOutput.innerText = draftedEmail;

            } catch (err) {
                emailOutput.innerText = "❌ Network Error: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Draft Formal Email";
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('emailOutput').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtnText = document.getElementById('copyBtnText');
                copyBtnText.innerText = "Copied! ✅";
                setTimeout(() => {
                    copyBtnText.innerText = "Copy";
                }, 2000);
            });
        }
    </script>
</body>
</html>
